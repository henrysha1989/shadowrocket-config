[MITM]
h2 = true
enable = false
# T5：只解密红果广告族（*reading-ad 通配，不碰 *-reading-video 内容 CDN，也不碰其他域）
# 开启方式：本配置 ⓘ → HTTPS 解密（或把上面 enable 改成 true）
# 广告/埋点域的解密清单已移到模块 `ad-mitm.module`（%APPEND% 追加），新增域名只改那一个文件
hostname = google.cn, *.google.cn, g.cn, *.g.cn
