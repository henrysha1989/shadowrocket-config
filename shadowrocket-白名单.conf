# 2026-09-25 定稿：8 段精简为 4 块；规则 71 → 69 条；修正 5 条被代理列表抢走的死规则；
#   合并 101.226/16 + 101.227/16 → 101.226/15（唯一一处规则集合变化）。
#   未改动的语义：172.64/13 剔除、海外前置、skip-proxy 清洗、[General] 全部 18 键。

