# Shadowrocket: 2026-09-25 (精简版 v2)
#
# 结构原则：从具体到宽泛（Shadowrocket/Surge 文档推荐顺序）
#   ① 拦截      最先，被拒的请求不进入后续任何匹配
#   ② 精确直连  必须早于 ③ —— 否则被 ③ 的服务列表抢走（Apple OTA/OCSP 踩过这个坑）
#   ③ 代理      必须早于 ④ —— 否则被 ④ 的大表泛域名误截（你上版的改动方向）
#   ④ 直连大表 + 微信直连 + 兜底
