[URL Rewrite]
# Google 防跳转：google.cn / g.cn → www.google.com（$1 保留原路径与查询参数）
#
# ⚠️ 当前【不开 MITM】（见 [MITM] enable = false）⇒ 只有明文 HTTP 这一跳会被重写。
#    实测覆盖范围（每一跳都验证过）：
#      · 敲 google.cn         ✅ 生效 —— 服务端 302 到 http://www.google.cn/，那一跳是明文，拦得到
#      · 敲 www.google.cn     ❌ 不生效 —— 全程 https，返回 200 落地页，没有明文跳
#      · google.cn/search?q=x ❌ 不生效 —— https 直接 404，无跳转
#    要让后两者也生效，只能开 MITM + 安装并信任 CA 证书（本人不开，故接受此限制）。
^https?://(?:www\.)?google\.cn(.*)$ https://www.google.com$1 302
^https?://(?:www\.)?g\.cn(.*)$ https://www.google.com$1 302
#
# 正则里的 https? 保留着：不开 MITM 时 https 那一支看不到明文请求、不会触发；
# 将来若开启 MITM 即自动生效，无需改规则。
# 写法用【无引号】：Surge 手册与 Shadowrocket 文档示例、5 个真实配置全部无引号，
# 且无引号在"App 会剥引号 / 不剥引号"两种情况下都能工作（带引号只在"会剥"时能工作）。

[MITM]
h2 = false
# 不开 MITM（2026-09-25 决定）：不安装 CA 证书、不解密任何流量。
# hostname 原位保留，将来要开只需 enable 改 true + 安装并信任 CA 证书。
enable = false
hostname = g.cn, *.g.cn, google.cn, *.google.cn
# 若将来开启：hostname 要"通配符 + 裸域"都写（*.x 不匹配裸域），且只放重写规则真正会读到的域，
# 否则只是单纯扩大解密面（证书固定的 App 会因此断连）。功耗不是理由 —— 已实测解密量为零。
