[URL Rewrite]
'^https?://(?:www\.)?google\.cn(.*)$' 'https://www.google.com$1' 302
'^https?://(?:www\.)?g\.cn(.*)$' 'https://www.google.com$1' 302
[MITM]
# [MITM] 只服务上面的 google.cn 重写（hostname 仅这 4 条）。字节系模块因证书固定（pinning）暂停中——
# 重新启用时其 hostname 由模块 %APPEND% 追加，不用写这里；回滚：enable 改回 false。
h2 = true
enable = true
hostname = google.cn, *.google.cn, g.cn, *.g.cn
