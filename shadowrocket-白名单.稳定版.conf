RULE-SET,https://git.521989.xyz/https://raw.githubusercontent.com/henrysha1989/shadowrocket-adr-rules/main/direct-custom.list,DIRECT
RULE-SET,https://git.521989.xyz/https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Lan/Lan.list,DIRECT
RULE-SET,https://git.521989.xyz/https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/STUN/STUN.list,DIRECT

RULE-SET,https://git.521989.xyz/https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Apple/Apple.list,DIRECT
DOMAIN-SET,https://git.521989.xyz/https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Apple/Apple_Domain.list,DIRECT

RULE-SET,https://git.521989.xyz/https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/BlockHttpDNS/BlockHttpDNS.list,REJECT
DOMAIN-SET,https://git.521989.xyz/https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/AdvertisingLite/AdvertisingLite_Domain.list,REJECT-DROP
RULE-SET,https://git.521989.xyz/https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/AdvertisingLite/AdvertisingLite.list,REJECT
DOMAIN-SET,https://git.521989.xyz/https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Privacy/Privacy_Domain.list,REJECT-DROP
RULE-SET,https://git.521989.xyz/https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Privacy/Privacy.list,REJECT-DROP

RULE-SET,https://git.521989.xyz/https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/GlobalMedia/GlobalMedia.list,PROXY

RULE-SET,https://git.521989.xyz/https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/ChinaMedia/ChinaMedia.list,DIRECT
RULE-SET,https://git.521989.xyz/https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Download/Download.list,DIRECT
DOMAIN-SET,https://git.521989.xyz/https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/China/China_Domain.list,DIRECT

GEOIP,CN,DIRECT
FINAL,PROXY

[URL Rewrite]
'^https?://(?:www\.)?google\.cn(.*)$' 'https://www.google.com$1' 302
'^https?://(?:www\.)?g\.cn(.*)$' 'https://www.google.com$1' 302

[MITM]
h2 = true
enable = false
hostname = google.cn, *.google.cn, g.cn, *.g.cn
