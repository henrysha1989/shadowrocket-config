# 2026-10-14 晚：`GEOIP,CN` 的 `no-resolve` 已**摘掉**（owner 指令）。
#   摘它的原因（实测代价）：加了 no-resolve 之后，"不在国内域名清单里的域名"会跳过 GEOIP、
#   直接掉到 FINAL,PROXY。实测 23:31 那份手机 DB：**红果 77%、抖音 28% 的连接走了代理**，
#   而当时选中的节点是「🇯🇵 日本1」⇒ 国内内容绕日本 ⇒ 缓冲/卡（红果最明显）。
#   旧配置下这些主机 100% DIRECT（GEOIP 靠一次本地解析把它们兜住）。
#   ⚠️ 这个本地解析正是白天 dnsleaktest 出现运营商解析器的那条路径。当前判断：泄漏主要靠
#   DoT 那条路修掉、no-resolve 不是必需的 ⇒ 先摘回，再复核 dnsleaktest；
#   若又出现运营商解析器，改走"换一张更大的国内域名表（如 blackmatrix7 ChinaMax）"的路线，
#   **不要把 no-resolve 加回来**（那等于用国内内容的可用性换一个测试指标）。
GEOIP,CN,DIRECT
FINAL,PROXY
[URL Rewrite]
'^https?://(?:www\.)?google\.cn(.*)$' 'https://www.google.com$1' 302
'^https?://(?:www\.)?g\.cn(.*)$' 'https://www.google.com$1' 302
[MITM]
h2 = true
enable = false
hostname = google.cn, *.google.cn, g.cn, *.g.cn
