# [2026-10-14 停用·owner 指令「拦截段全清」] DOMAIN-SET,https://git.521989.xyz/https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Privacy/Privacy_Domain.list,REJECT-DROP
