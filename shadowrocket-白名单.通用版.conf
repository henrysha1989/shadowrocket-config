#  拦截段：2026-10-14 曾按 owner 指令临时"全清"（降规则数给朋友省电），当晚**已全部恢复** ——
#    5 个拦截集（BlockHttpDNS / AdvertisingLite_Domain / AdvertisingLite / Privacy_Domain / Privacy）
#    全部启用，规则总数回到 85,336，与 2026-10-10 的状态一致。
#  为什么：朋友反馈耗电异常。2026-10-14 实测对照 —— 同一台手机同一天：
#    Shadowrocket（8.5 万条）≈ 9.9 %/h ；Clash iOS（8,428 条）≈ 0.70 %/h。
#    两张 4 万级 DOMAIN 表占全部规则 91%，是 iOS 网络扩展（50 MB 上限）下最可疑的变量，
#    且正是 2026-10-06 挂上后耗电跳变的那次改动。
#  这一版**不再拦截广告/跟踪/HTTPDNS**；要拦就用 DNS 层（AdGuard Home 或带过滤的公共 DoH）。
#  [General] 段（DNS/QUIC/hijack 等）本次**一个字没动** —— 一次只改一处才能看清是谁的效果。
