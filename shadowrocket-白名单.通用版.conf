# 2026-10-14 晚（owner 指令，治 DNS 泄漏）：`GEOIP,CN` 补上 `no-resolve`。
#   手册 716-718：域名请求遇到 IP 类规则会**触发一次本地 DNS 查询**来判断归属。
#   缺 `no-resolve` ⇒ 每个没被前面域名规则命中的域名都多打一次本地解析 ——
#   那次查询落到系统/路由器（运营商解析器），判定不匹配后连接仍走 FINAL,PROXY，
#   节点再解析一次 ⇒ dnsleaktest 上就是「运营商解析器 + 节点侧解析器」混在一起的指纹。
#   ⚠️ 代价：不再被 GEOIP 兜到直连的国内域名（不在清单里的）会走代理 ——
#   这正是 clash-for-ios-config 那份的既有取舍（它写的就是 `GEOIP,CN,国内直连,no-resolve`）。
#   ⚠️ 前提：必须有一张能可靠加载的国内域名表（本配置 = China_Domain.list 3689 条，走加速站）。
GEOIP,CN,DIRECT,no-resolve
FINAL,PROXY
[URL Rewrite]
'^https?://(?:www\.)?google\.cn(.*)$' 'https://www.google.com$1' 302
'^https?://(?:www\.)?g\.cn(.*)$' 'https://www.google.com$1' 302
[MITM]
h2 = true
enable = false
hostname = google.cn, *.google.cn, g.cn, *.g.cn
